[package]
name = "stash-core"
description = "Headless core for Semantic Stash Viewer: Stash adapter, connection logic, profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate MUST NOT depend on a UI toolkit (constitution Principle III).

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
# Typed GraphQL (007 research R5): queries and fragments as Rust structs checked against Stash
# v0.31.1's schema at build time. MPL-2.0, used unmodified.
cynic = "3.14"
tokio-util = "0.7"
semver = "1"
# View cache (003 research R1): SQLite compiled in, no system library.
rusqlite = { version = "0.40", features = ["bundled"] }
# Free disk space for the cache's size limit (003 research R1b); already in the tree.
rustix = { version = "1", features = ["fs"] }
# Jobs subscription over graphql-transport-ws (research R5). rustls + futures-util are already
# in the tree via reqwest; they're named here for the lenient-TLS verifier and the socket stream.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Scene thumbnails (005 research R5): libjpeg-turbo DCT-scaled decode and encode. Linked from the
# system library when it's 3.0 or newer (ffmpeg already depends on it); otherwise built from source
# with CMake (Ubuntu 24.04 ships 2.1, so CI builds it; needs cmake and nasm).
turbojpeg = { version = "1", default-features = false, features = ["pkg-config", "cmake"] }
# SIMD resizing to the thumbnail width.
fast_image_resize = "5"
# Non-JPEG covers (uploaded or scraped PNG/WebP) only.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[build-dependencies]
cynic-codegen = "3.14"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
rcgen = "0.14"
tokio-rustls = "0.26"
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }

[lints]
workspace = true
