# One page of scene cards for the Scenes grid and list (005 research R1).
# Card fields only (constitution Principle IV); one request per 120-card page.
query FindScenesPage($filter: FindFilterType) {
  findScenes(filter: $filter) {
    count
    scenes {
      id
      title
      date
      files {
        basename
        duration
        width
        height
      }
      studio {
        name
      }
      paths {
        screenshot
      }
    }
  }
}
