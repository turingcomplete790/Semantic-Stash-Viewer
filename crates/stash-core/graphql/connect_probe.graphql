# One round trip on connect: identity, version, readiness, and the library summary (FR-007).
# Select only what the connection screen needs (constitution Principle IV).
query ConnectProbe {
  version {
    version
    hash
  }
  systemStatus {
    appSchema
    status
  }
  stats {
    scene_count
    image_count
    gallery_count
    performer_count
  }
}
