# One round trip on connect: identity, version, readiness, and the library summary (FR-007).
# Select only what the connection screen needs (constitution Principle IV).
query ConnectProbe {
  version {
    version
    hash
  }
  systemStatus {
    appSchema
    status
    # Tells two Stash instances at the same address apart (003 research R2). Only a hash of
    # these is kept; the paths themselves are never stored.
    databasePath
    configPath
  }
  stats {
    scene_count
    image_count
    gallery_count
    performer_count
  }
}
