# One scene for playback. The stream URL is NOT read from Stash: the core builds the direct
# `/scene/{id}/stream` URL itself (Stash's `paths.stream` embeds the API key when auth is on).
query PlayableScene($id: ID!) {
  findScene(id: $id) {
    id
    title
    files {
      basename
      duration
      width
      height
      video_codec
      audio_codec
      format
      frame_rate
      bit_rate
      size
    }
  }
}
