[package]
name = "player"
description = "Headless mpv playback session for Semantic Stash Viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate MUST NOT depend on a UI toolkit (constitution Principle III). Window-system glue
# lives in native-ui/src/player/video/.

[dependencies]
libmpv2 = "6"
libc = "0.2"
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
tempfile = "3"

[lints]
workspace = true
