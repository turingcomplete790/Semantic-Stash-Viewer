name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it supersedes (003 research R10).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # A hung test can't hold a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # libmpv for the player, libturbojpeg for thumbnails, and Mesa's software Vulkan
      # (lavapipe) with EGL so the UI's headless tests can draw (007).
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg libturbojpeg0-dev mesa-vulkan-drivers libegl1 libwayland-client0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rust format
        run: cargo fmt --all --check

      # Includes the unsafe-code lints (constitution C4).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
