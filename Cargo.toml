[workspace]
members = ["crates/stash-core", "crates/player", "native-ui", "crates/perf-harness"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Dependencies (iced, wgpu, text shaping, image decoding) are optimised even in debug builds,
# without debug assertions: the UI and the harness's measurements run debug builds, and
# unoptimised, assertion-checked dependencies made them several times slower than the shipped app
# (the standard library's precondition checks alone were a third of image resizing). Our own
# crates keep their assertions.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

# The UI crate itself at opt-level 1: iced's widget code is generic over the app's message type,
# so it's compiled here, and unoptimised it made layout several times slower than the shipped app.
# Debug assertions (which the measurement code needs) stay on.
[profile.dev.package.semantic-stash-viewer-native]
opt-level = 1
